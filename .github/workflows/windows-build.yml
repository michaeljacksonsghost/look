name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore .\Look.slnx
      - name: Build Release
        run: dotnet build .\Look.slnx --configuration Release --no-restore
      - name: Run tests
        run: dotnet test .\Look.slnx --configuration Release --no-build --no-restore
